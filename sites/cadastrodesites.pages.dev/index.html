<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Sites</title>

<meta
  name="description"
  content="Diretório de sites cadastrados na internet."
>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&display=swap');

:root {
  --bg: #f1efe8;
  --paper: #faf9f5;
  --paper2: #e8e5dc;
  --text: #171717;
  --muted: #77746c;
  --line: #c9c6bc;
  --dark: #171717;
  --danger: #a43e38;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "DM Mono", monospace;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
}


/* ========================================
   HEADER
======================================== */

header {
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.header-inner {
  max-width: 1250px;
  margin: auto;
  min-height: 78px;
  padding: 0 25px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  font-family: "Libre Baskerville", serif;
  font-weight: 700;
  font-size: 18px;
}

.logo small {
  display: block;
  margin-top: 5px;

  font-family: "DM Mono", monospace;
  font-size: 8px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

nav {
  display: flex;
  gap: 8px;
}

nav a {
  padding: 10px 12px;

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;

  border: 1px solid transparent;
}

nav a:hover {
  border-color: var(--line);
  background: var(--paper2);
}


/* ========================================
   CONTAINER
======================================== */

.container {
  width: min(1250px, calc(100% - 40px));
  margin: auto;
}


/* ========================================
   HERO
======================================== */

.hero {
  padding: 85px 0 65px;
}

.hero-label {
  display: inline-block;

  border: 1px solid var(--line);
  padding: 7px 9px;

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.hero h1 {
  max-width: 850px;

  margin: 22px 0 15px;

  font-family: "Libre Baskerville", serif;
  font-size: clamp(38px, 7vw, 76px);
  line-height: 1.05;
  letter-spacing: -3px;
}

.hero p {
  max-width: 650px;

  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}


/* ========================================
   SECTION
======================================== */

.section {
  padding: 35px 0 75px;
}

.section-title {
  margin-bottom: 22px;

  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
}

.section-title h2 {
  margin: 0;

  font-family: "Libre Baskerville", serif;
  font-size: 23px;
}

.section-title span {
  color: var(--muted);
  font-size: 9px;
}


/* ========================================
   CARDS
======================================== */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.card {
  min-height: 260px;

  background: var(--paper);
  border: 1px solid var(--line);

  padding: 23px;

  display: flex;
  flex-direction: column;

  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 6px 6px 0 var(--text);
}

.card-number {
  color: var(--muted);
  font-size: 9px;
}

.card h3 {
  margin: 30px 0 8px;

  font-family: "Libre Baskerville", serif;
  font-size: 19px;
}

.card-domain {
  color: var(--muted);
  font-size: 9px;
}

.card-description {
  margin-top: 18px;

  color: #5e5b54;
  font-size: 10px;
  line-height: 1.8;
}

.card-bottom {
  margin-top: auto;
  padding-top: 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-top: 1px solid var(--line);
}

.tag {
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-link {
  font-size: 9px;
  text-transform: uppercase;
}


/* ========================================
   CATEGORIAS
======================================== */

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.category-link {
  padding: 12px 15px;

  border: 1px solid var(--line);
  background: var(--paper);

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;

  transition: .2s;
}

.category-link:hover {
  background: var(--dark);
  color: var(--paper);
}


/* ========================================
   INDIVIDUAL
======================================== */

.individual {
  padding: 75px 0;
}

.back {
  display: inline-block;
  margin-bottom: 35px;

  color: var(--muted);
  font-size: 9px;
  text-transform: uppercase;
}

.individual-box {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 40px;
}

.individual-box h1 {
  margin: 15px 0 10px;

  font-family: "Libre Baskerville", serif;
  font-size: clamp(30px, 5vw, 55px);
}

.individual-domain {
  color: var(--muted);
  font-size: 11px;
}

.individual-description {
  max-width: 700px;

  margin: 35px 0;

  color: #5d5a53;
  font-size: 12px;
  line-height: 2;
}

.visit-button {
  display: inline-block;

  padding: 14px 18px;

  background: var(--dark);
  color: var(--paper);

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
}


/* ========================================
   FORMULÁRIO PÚBLICO
======================================== */

.cadastro-publico {
  margin: 35px 0 80px;

  padding: 45px;

  background: var(--dark);
  color: var(--paper);

  border: 1px solid #000;

  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 55px;
}

.cadastro-header span {
  color: #85827a;

  font-size: 9px;
  letter-spacing: 2px;
}

.cadastro-header h2 {
  margin: 15px 0;

  font-family: "Libre Baskerville", serif;
  font-size: 31px;
  line-height: 1.2;
}

.cadastro-header p {
  max-width: 390px;

  color: #98958c;

  font-size: 10px;
  line-height: 1.9;
}

.cadastro-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.campo label {
  display: block;
  margin-bottom: 8px;

  color: #99958b;

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.campo input,
.campo textarea {
  width: 100%;

  border: 1px solid #41403c;
  background: #20201e;
  color: var(--paper);

  padding: 13px;

  outline: none;

  font-size: 10px;
}

.campo input:focus,
.campo textarea:focus {
  border-color: var(--paper);
}

.campo textarea {
  min-height: 120px;
  resize: vertical;
}

.campo-full {
  grid-column: 1 / -1;
}

.botao-enviar {
  grid-column: 1 / -1;

  padding: 15px;

  border: 0;

  background: var(--paper);
  color: var(--dark);

  cursor: pointer;

  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.botao-enviar:hover {
  background: white;
}

.mensagem-cadastro {
  display: none;

  grid-column: 1 / -1;

  padding: 15px;

  border: 1px solid #555;

  font-size: 10px;
  line-height: 1.7;
}

.mensagem-cadastro.show {
  display: block;
}


/* ========================================
   ADMIN
======================================== */

.admin-screen {
  min-height: 100vh;
  background: #151515;
  color: #f4f1e9;
}

.admin-header {
  border-bottom: 1px solid #373631;
  padding: 25px;
}

.admin-header-inner {
  max-width: 1250px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.admin-logo {
  font-family: "Libre Baskerville", serif;
  font-size: 20px;
}

.admin-label {
  color: #77746d;
  margin-top: 5px;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.admin-exit {
  border: 1px solid #44423d;
  background: transparent;
  color: #aaa69e;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 9px;
  text-transform: uppercase;
}

.admin-content {
  max-width: 1250px;
  margin: auto;
  padding: 45px 25px;
}

.admin-title {
  margin-bottom: 30px;
}

.admin-title h1 {
  margin: 0;

  font-family: "Libre Baskerville", serif;
  font-size: 32px;
}

.admin-title p {
  color: #88847c;
  font-size: 10px;
}

.admin-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 30px;
}

.admin-stat {
  padding: 20px;

  border: 1px solid #363531;
  background: #1e1e1c;
}

.admin-stat span {
  color: #77746d;

  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.admin-stat strong {
  display: block;
  margin-top: 10px;

  font-family: "Libre Baskerville", serif;
  font-size: 27px;
}

.admin-panel {
  border: 1px solid #363531;
  background: #1d1d1b;
}

.admin-panel-header {
  padding: 20px;

  border-bottom: 1px solid #363531;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.admin-panel-header h2 {
  margin: 0;

  font-family: "Libre Baskerville", serif;
  font-size: 15px;
}

.admin-new {
  border: 0;

  padding: 11px 14px;

  background: var(--paper);
  color: #111;

  cursor: pointer;

  font-size: 9px;
  text-transform: uppercase;
}

.admin-table-wrap {
  overflow-x: auto;
}

.admin-table {
  width: 100%;
  min-width: 700px;
  border-collapse: collapse;
}

.admin-table th {
  padding: 14px 18px;

  border-bottom: 1px solid #363531;

  color: #77746d;

  text-align: left;

  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.admin-table td {
  padding: 17px 18px;

  border-bottom: 1px solid #302f2c;

  font-size: 10px;
}

.admin-site-name {
  color: white;

  font-family: "Libre Baskerville", serif;
  font-size: 11px;
}

.admin-domain {
  margin-top: 5px;

  color: #77746d;
  font-size: 8px;
}

.admin-category {
  display: inline-block;

  padding: 5px 7px;

  border: 1px solid #45433f;

  color: #aaa69e;

  font-size: 8px;
}

.admin-actions {
  display: flex;
  gap: 6px;
}

.admin-action {
  padding: 8px 10px;

  border: 1px solid #44423d;
  background: transparent;
  color: #aaa69e;

  cursor: pointer;

  font-size: 8px;
  text-transform: uppercase;
}

.admin-action:hover {
  color: white;
  background: #2a2926;
}

.admin-action.delete:hover {
  background: var(--danger);
  border-color: var(--danger);
}


/* ========================================
   ADMIN FORM
======================================== */

.admin-form-box {
  margin-top: 30px;

  display: none;

  border: 1px solid #363531;
  background: #1d1d1b;
}

.admin-form-box.show {
  display: block;
}

.admin-form-header {
  padding: 20px;

  border-bottom: 1px solid #363531;

  font-family: "Libre Baskerville", serif;
  font-size: 15px;
}

.admin-form {
  padding: 25px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 17px;
}

.admin-field-full {
  grid-column: 1 / -1;
}

.admin-form label {
  display: block;
  margin-bottom: 8px;

  color: #88847c;

  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.admin-form input,
.admin-form textarea {
  width: 100%;

  padding: 13px;

  border: 1px solid #44423d;

  background: #151515;
  color: white;

  outline: none;

  font-size: 10px;
}

.admin-form textarea {
  min-height: 110px;
  resize: vertical;
}

.admin-form input:focus,
.admin-form textarea:focus {
  border-color: #aaa69e;
}

.admin-form-actions {
  grid-column: 1 / -1;

  padding-top: 20px;

  border-top: 1px solid #363531;

  display: flex;
  gap: 8px;
}

.admin-save {
  padding: 13px 18px;

  border: 0;

  background: var(--paper);
  color: #111;

  cursor: pointer;

  font-size: 9px;
  text-transform: uppercase;
}

.admin-cancel {
  padding: 13px 18px;

  border: 1px solid #44423d;

  background: transparent;
  color: #aaa69e;

  cursor: pointer;

  font-size: 9px;
  text-transform: uppercase;
}


/* ========================================
   PEDIDOS
======================================== */

.pedido {
  padding: 20px;

  border-bottom: 1px solid #302f2c;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.pedido:last-child {
  border-bottom: 0;
}

.pedido-info strong {
  display: block;

  font-family: "Libre Baskerville", serif;
  font-size: 12px;
}

.pedido-info span {
  display: block;

  margin-top: 6px;

  color: #77746d;

  font-size: 9px;
}

.pedido-actions {
  display: flex;
  gap: 7px;
  flex-shrink: 0;
}

.aprovar {
  border-color: #59694f;
}

.aprovar:hover {
  background: #59694f;
}


/* ========================================
   FOOTER
======================================== */

footer {
  border-top: 1px solid var(--line);
  padding: 30px 0;

  color: var(--muted);

  font-size: 9px;
}


/* ========================================
   RESPONSIVO
======================================== */

@media (max-width: 900px) {

  .grid {
    grid-template-columns: 1fr 1fr;
  }

  .cadastro-publico {
    grid-template-columns: 1fr;
  }

}

@media (max-width: 650px) {

  .header-inner {
    align-items: flex-start;
    flex-direction: column;
    padding: 20px 0;
  }

  nav {
    width: 100%;
  }

  nav a {
    padding-left: 0;
  }

  .container {
    width: min(100% - 28px, 1250px);
  }

  .hero {
    padding: 55px 0;
  }

  .hero h1 {
    letter-spacing: -2px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .cadastro-publico {
    padding: 25px;
  }

  .cadastro-form {
    grid-template-columns: 1fr;
  }

  .campo-full,
  .botao-enviar {
    grid-column: auto;
  }

  .admin-stats {
    grid-template-columns: 1fr;
  }

  .admin-form {
    grid-template-columns: 1fr;
  }

  .admin-field-full,
  .admin-form-actions {
    grid-column: auto;
  }

  .pedido {
    align-items: flex-start;
    flex-direction: column;
  }

}

</style>
</head>

<body>

<div id="app"></div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const ADMIN_USUARIO = "admin";
const ADMIN_SENHA = "mbksites2026";

const SITES_KEY = "cadastro_sites_admin";
const PEDIDOS_KEY = "cadastro_sites_pedidos";


/* =====================================================
   CADASTROS INICIAIS
===================================================== */

const cadastrosIniciais = [

  {
    chave: "multipage.pages.dev",
    nome: "Multipage",
    url: "multipage.pages.dev",
    urlCompleta: "https://multipage.pages.dev/",
    categoria: "Criação de Sites",
    data: "22/09/2026",
    descricao:
      "Plataforma e projeto voltado para criação e desenvolvimento de sites."
  },

  {
    chave: "prsauto.pages.dev",
    nome: "PRS AUTO - CARROS",
    url: "prsauto.pages.dev",
    urlCompleta: "https://prsauto.pages.dev/",
    categoria: "Empresas",
    data: "22/09/2026",
    descricao:
      "Site institucional da PRS AUTO."
  },

  {
    chave: "cadastrodesites.pages.dev",
    nome: "Cadastro de Sites",
    url: "cadastrodesites.pages.dev",
    urlCompleta: "https://cadastrodesites.pages.dev/",
    categoria: "Tecnologia",
    data: "22/09/2026",
    descricao:
      "Diretório para encontrar e divulgar sites na internet."
  }

];


/* =====================================================
   STORAGE
===================================================== */

function carregarSites() {

  const salvo =
    localStorage.getItem(SITES_KEY);

  if (salvo) {

    try {

      return JSON.parse(salvo);

    } catch {

      localStorage.setItem(
        SITES_KEY,
        JSON.stringify(cadastrosIniciais)
      );

      return [...cadastrosIniciais];

    }

  }

  localStorage.setItem(
    SITES_KEY,
    JSON.stringify(cadastrosIniciais)
  );

  return [...cadastrosIniciais];

}


function salvarSites(sites) {

  localStorage.setItem(
    SITES_KEY,
    JSON.stringify(sites)
  );

}


function carregarPedidos() {

  try {

    return JSON.parse(
      localStorage.getItem(PEDIDOS_KEY) || "[]"
    );

  } catch {

    return [];

  }

}


function salvarPedidos(pedidos) {

  localStorage.setItem(
    PEDIDOS_KEY,
    JSON.stringify(pedidos)
  );

}


/* =====================================================
   UTILITÁRIOS
===================================================== */

function escapar(valor) {

  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function normalizarDominio(valor) {

  return valor
    .replace(/^https?:\/\//i, "")
    .replace(/^www\./i, "")
    .replace(/\/.*$/, "")
    .trim();

}


function dataAtual() {

  const agora = new Date();

  return (
    String(agora.getDate()).padStart(2, "0") +
    "/" +
    String(agora.getMonth() + 1).padStart(2, "0") +
    "/" +
    agora.getFullYear()
  );

}


/* =====================================================
   ROTA
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const c =
  params.get("c");

const categoria =
  params.get("categoria");

const admin =
  params.get("admin");

const senha =
  params.get("senha");


/* =====================================================
   ADMIN VIA URL
===================================================== */

if (
  admin === ADMIN_USUARIO &&
  senha === ADMIN_SENHA
) {

  mostrarAdmin();

}

else if (c) {

  mostrarIndividual(c);

}

else if (categoria) {

  mostrarCategoria(categoria);

}

else {

  mostrarPublico();

}


/* =====================================================
   PÁGINA PÚBLICA
===================================================== */

function mostrarPublico() {

  const sites =
    carregarSites();

  const categorias = [
    ...new Set(
      sites.map(site => site.categoria)
    )
  ].sort();


  document.getElementById("app").innerHTML = `

    <header>

      <div class="header-inner">

        <a href="./" class="logo">
          CADASTRO DE SITES

          <small>
            Diretório independente
          </small>
        </a>

        <nav>

          <a href="./">
            Início
          </a>

          <a href="#sites">
            Sites
          </a>

          <a href="#categorias">
            Categorias
          </a>

          <a href="#enviar">
            Cadastrar site
          </a>

        </nav>

      </div>

    </header>


    <main>

      <section class="hero">

        <div class="container">

          <span class="hero-label">
            Diretório de internet
          </span>

          <h1>
            Sites cadastrados
            na internet.
          </h1>

          <p>
            Um espaço simples para encontrar,
            conhecer e divulgar sites independentes,
            projetos, empresas e iniciativas digitais.
          </p>

        </div>

      </section>


      <section
        class="section"
        id="sites"
      >

        <div class="container">

          <div class="section-title">

            <h2>
              Sites cadastrados
            </h2>

            <span>
              ${sites.length}
              registros
            </span>

          </div>

          <div class="grid">

            ${
              sites.length
                ? sites.map(cardSite).join("")
                : `
                  <p>
                    Nenhum site cadastrado ainda.
                  </p>
                `
            }

          </div>

        </div>

      </section>


      <section
        class="section"
        id="categorias"
      >

        <div class="container">

          <div class="section-title">

            <h2>
              Categorias
            </h2>

          </div>

          <div class="categories">

            ${
              categorias.map(cat => `
                <a
                  class="category-link"
                  href="./?categoria=${encodeURIComponent(cat)}"
                >
                  ${escapar(cat)}
                </a>
              `).join("")
            }

          </div>

        </div>

      </section>


      ${formularioPublico()}

    </main>


    <footer>

      <div class="container">

        CADASTRO DE SITES —
        INTERNET INDEPENDENTE.

      </div>

    </footer>

  `;

  configurarFormularioPublico();

}


/* =====================================================
   CARD
===================================================== */

function cardSite(site, index) {

  return `

    <article class="card">

      <div class="card-number">
        ${String(index + 1).padStart(2, "0")}

function configurarFormularioPublico() {

  const form =
    document.getElementById("formPublico");

  if (!form) return;


  form.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const pedido = {

        id: Date.now(),

        nome:
          document
            .getElementById("publicoNome")
            .value
            .trim(),

        url:
          normalizarDominio(
            document
              .getElementById("publicoUrl")
              .value
              .trim()
          ),

        urlCompleta:
          document
            .getElementById("publicoUrlCompleta")
            .value
            .trim(),

        categoria:
          document
            .getElementById("publicoCategoria")
            .value
            .trim(),

        descricao:
          document
            .getElementById("publicoDescricao")
            .value
            .trim(),

        data: dataAtual(),

        status: "pendente"

      };


      const pedidos =
        carregarPedidos();


      pedidos.push(pedido);

      salvarPedidos(pedidos);


      form.reset();


      const mensagem =
        document.getElementById(
          "mensagemCadastro"
        );


      mensagem.innerHTML = `
        <strong>✓ Pedido enviado.</strong><br>
        Seu site foi enviado para análise da administração.
      `;

      mensagem.classList.add("show");

    }

/* =====================================================
   NOVO ADMIN
===================================================== */

function abrirFormAdmin() {

  document
    .getElementById("adminFormBox")
    .classList.add("show");

  document
    .getElementById("adminFormTitulo")
    .textContent =
      "Novo cadastro";

  document
    .getElementById("adminForm")
    .reset();

  document
    .getElementById("adminData")
    .value = dataAtual();

}


function fecharFormAdmin() {

  document
    .getElementById("adminFormBox")
    .classList.remove("show");

}


/* =====================================================
   FORM ADMIN
===================================================== */

let editandoAdmin = null;


document.addEventListener(
  "submit",
  function(event) {

    if (
      event.target.id !== "adminForm"
    ) return;


    event.preventDefault();


    const sites =
      carregarSites();


    const cadastro = {

      chave:
        normalizarDominio(
          document
            .getElementById("adminUrl")
            .value
            .trim()
        ),

      nome:
        document
          .getElementById("adminNome")
          .value
          .trim(),

      url:
        normalizarDominio(
          document
            .getElementById("adminUrl")
            .value
            .trim()
        ),

      urlCompleta:
        document
          .getElementById("adminUrlCompleta")
          .value
          .trim(),

      categoria:
        document
          .getElementById("adminCategoria")
          .value
          .trim(),

      data:
        document
          .getElementById("adminData")
          .value
          .trim(),

      descricao:
        document
          .getElementById("adminDescricao")
          .value
          .trim()

    };


    if (editandoAdmin === null) {

      sites.push(cadastro);

    }

    else {

      sites[editandoAdmin] =
        cadastro;

      editandoAdmin = null;

    }


    salvarSites(sites);

    fecharFormAdmin();

    renderAdmin();

  }
);


/* =====================================================
   EDITAR
===================================================== */

function editarAdmin(index) {

  const sites =
    carregarSites();

  const site =
    sites[index];

  if (!site) return;


  editandoAdmin = index;


  document
    .getElementById("adminFormBox")
    .classList.add("show");


  document
    .getElementById("adminFormTitulo")
    .textContent =
      "Editar cadastro";


  document
    .getElementById("adminNome")
    .value = site.nome;

  document
    .getElementById("adminUrl")
    .value = site.url;

  document
    .getElementById("adminUrlCompleta")
    .value = site.urlCompleta;

  document
    .getElementById("adminCategoria")
    .value = site.categoria;

  document
    .getElementById("adminData")
    .value = site.data;

  document
    .getElementById("adminDescricao")
    .value = site.descricao;


  document
    .getElementById("adminFormBox")
    .scrollIntoView({
      behavior: "smooth"
    });

}


/* =====================================================
   EXCLUIR
===================================================== */

function excluirAdmin(index) {

  const sites =
    carregarSites();

  const site =
    sites[index];

  if (!site) return;


  if (
    !confirm(
      `Excluir "${site.nome}"?`
    )
  ) return;


  sites.splice(index, 1);

  salvarSites(sites);

  renderAdmin();

}


/* =====================================================
   APROVAR PEDIDO
===================================================== */

function aprovarPedido(index) {

  const pedidos =
    carregarPedidos();

  const pedido =
    pedidos[index];

  if (!pedido) return;


  const sites =
    carregarSites();


  const cadastro = {

    chave:
      normalizarDominio(
        pedido.url
      ),

    nome:
      pedido.nome,

    url:
      pedido.url,

    urlCompleta:
      pedido.urlCompleta,

    categoria:
      pedido.categoria,

    data:
      pedido.data,

    descricao:
      pedido.descricao

  };


  sites.push(cadastro);

  pedidos.splice(index, 1);


  salvarSites(sites);

  salvarPedidos(pedidos);


  renderAdmin();

}


/* =====================================================
   RECUSAR PEDIDO
===================================================== */

function recusarPedido(index) {

  const pedidos =
    carregarPedidos();


  if (
    !pedidos[index]
  ) return;


  if (
    !confirm(
      "Recusar este pedido?"
    )
  ) return;


  pedidos.splice(index, 1);

  salvarPedidos(pedidos);

  renderAdmin();

}

</script>
